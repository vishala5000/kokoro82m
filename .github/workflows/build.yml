name: Build Kokoro TTS APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y p7zip-full wget unzip

      - name: Download Kokoro-82M ONNX (fp16) + voices
        run: |
          chmod +x scripts/download_model.sh
          ./scripts/download_model.sh

      - name: Download espeak-ng data
        run: |
          chmod +x scripts/download_espeak.sh
          ./scripts/download_espeak.sh

      - name: Generate debug keystore (no secrets needed)
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=US"

      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APK with apksigner
        run: |
          ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED="app/build/outputs/apk/release/KokoroTTS-signed.apk"
          # If gradle already produced a signed one, use it; else sign the unsigned one
          if [ ! -f "$APK" ]; then
            APK=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          fi
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks app/debug.keystore \
            --ks-pass pass:android \
            --ks-key-alias androiddebugkey \
            --key-pass pass:android \
            --out "$SIGNED" "$APK"
          echo "Signed APK: $SIGNED"

      - name: Verify APK
        run: |
          ANDROID_HOME=${ANDROID_HOME:-$HOME/android-sdk}
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify \
            app/build/outputs/apk/release/KokoroTTS-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KokoroTTS-Release
          path: app/build/outputs/apk/release/KokoroTTS-signed.apk
